<!doctype html>
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: "Geist Variable";
    src: url("/node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2") format("woff2");
    font-weight: 100 900;
  }
  html,
  body {
    margin: 0;
  }
  svg {
    display: block;
  }
</style>
<svg id="stage" xmlns="http://www.w3.org/2000/svg"></svg>
<script type="module">
  import { THEMES } from "./kit.js";

  const params = new URLSearchParams(location.search);
  const { createScene } = await import(`./${params.get("scene")}.js`);
  const theme = params.get("theme");
  const colors = THEMES[theme];
  const svg = document.getElementById("stage");
  await document.fonts.load('16px "Geist Variable"');
  const scene = createScene(svg, { theme, layout: params.get("layout"), colors });
  svg.setAttribute("viewBox", `0 0 ${scene.width} ${scene.height}`);
  svg.setAttribute("width", scene.width);
  svg.setAttribute("height", scene.height);
  document.body.style.background = colors.bg;
  scene.render(0);
  window.scene = scene;
  window.ready = true;
</script>
